version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (e.g. create-github-app-token,
  # checkout, setup-go). Required so pinned SHAs don't silently go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Go module dependencies.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
