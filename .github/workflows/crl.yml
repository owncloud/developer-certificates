name: crl

# The CRL bot regenerates crl/developers.crl from the public ledger
# (attestation-and-crl spec §3). It runs daily (so nextUpdate stays fresh) and
# after each revocation workflow completes, then commits the artifact.
on:
  schedule:
    - cron: "0 0 * * *" # daily; keeps nextUpdate fresh (spec §3.1)
  workflow_dispatch:
  workflow_run:
    workflows: [revocation, privileged-revocation]
    types: [completed]

# Shares the issuer/revocation concurrency group so all ledger reads/writes are
# serialized; in-progress runs are never cancelled (enrollment spec §2).
concurrency:
  group: ledger-write
  cancel-in-progress: false

# Minimal permissions (design §10): the workflow's own GITHUB_TOKEN only needs
# to read for checkout. The CRL is written to protected `main` via the codesign-bot
# App token minted below (the ruleset bypass actor), not this token.
permissions:
  contents: read

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      # Mint a GitHub App token so crlgen commits the CRL to protected `main` via
      # the Contents API under the codesign-bot App identity (a GitHub-signed
      # commit, and the ruleset bypass actor — design §6). Replaces the former
      # shell `git push`, which produced unsigned commits.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: apptoken
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Generate and publish CRL
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUER_BOT_LOGIN: ${{ vars.ISSUER_BOT_LOGIN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_TRANSIT_KEY: ${{ vars.VAULT_TRANSIT_KEY }}
          INTERMEDIATE_KEY_PEM: ${{ secrets.INTERMEDIATE_KEY_PEM }}
          INTERMEDIATE_CERT: resources/codesigning/intermediates/intermediate-g2.crt
        run: go run ./cmd/crlgen
