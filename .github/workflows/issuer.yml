name: issuer

# The issuer bot polls open certificate-request issues and processes them
# (enrollment spec §4). It runs on a schedule and on issue events; it never acts
# on human comment events (spec §2: polling, not comment-triggered).
on:
  schedule:
    - cron: "*/10 * * * *" # spec §11: 10-minute poll cadence
  issues:
    types: [opened, edited, labeled]

# All ledger reads/writes are serialized under one concurrency group so FCFS is
# correct; in-progress runs are never cancelled (spec §2, design §6).
concurrency:
  group: ledger-write
  cancel-in-progress: false

# Minimal permissions (design §10): the workflow's default GITHUB_TOKEN is used
# ONLY by actions/checkout, so it needs read-only contents. All issue, comment,
# label and ledger writes go through the minted codesign-bot App token (passed as
# GITHUB_TOKEN env to the binary), which is the protected-main bypass actor (§6).
permissions:
  contents: read

jobs:
  issue:
    name: issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Mint a GitHub App token so the bot writes to protected `main` under the
      # codesign-bot App identity — the ruleset bypass actor (design §6). This
      # also makes the bot post/read its own comments under ISSUER_BOT_LOGIN.
      #
      # owner: owncloud scopes the token across the org repos the App is
      # installed on, not just this one — the issuer must read appinfo/info.xml
      # and the challenge file on the *target* app repo (enrollment spec §4
      # steps 4, 7), including private first-party apps. Without this the token
      # is scoped to developer-certificates alone and every target-repo read
      # 404s (issue #35). The token's actual reach is bounded by the App's
      # installed repositories and granted permissions.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: apptoken
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Run issuer
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token }}
          ISSUER_BOT_LOGIN: ${{ vars.ISSUER_BOT_LOGIN }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_TRANSIT_KEY: ${{ vars.VAULT_TRANSIT_KEY }}
          INTERMEDIATE_KEY_PEM: ${{ secrets.INTERMEDIATE_KEY_PEM }}
          INTERMEDIATE_CERT: resources/codesigning/intermediates/intermediate-g2.crt
        run: go run ./cmd/issuer
