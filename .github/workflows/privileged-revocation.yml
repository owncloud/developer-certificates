name: privileged-revocation

# Authoritative, org-gated certificate revocation (enrollment spec §5.2). This is
# a workflow_dispatch-ONLY workflow: it has no schedule and no issue trigger, so
# external issue filing can never reach it. GitHub restricts workflow_dispatch to
# users with write access to the repo — that platform gate is the org-member
# authorization; the triggering github.actor is recorded in the ledger.
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Target appId (the ledger/<appId>.json filename)"
        required: true
      serial:
        description: 'Target certificate serial ("0x…")'
        required: true
      reason:
        description: "Why this certificate is being revoked (recorded in the ledger)"
        required: true
      revoked_from:
        description: "Optional RFC3339 UTC date (blank = the cert's notBefore)"
        required: false

# Shares the issuer/revocation/CRL concurrency group so all ledger writes are
# serialized; in-progress runs are never cancelled (enrollment spec §2).
concurrency:
  group: ledger-write
  cancel-in-progress: false

# Minimal permissions (design §10): the workflow's default GITHUB_TOKEN is used
# ONLY by actions/checkout, so it needs read-only contents. The ledger write goes
# through the minted codesign-bot App token (passed as GITHUB_TOKEN env to the
# binary), which is the protected-main bypass actor (§6). No Vault, no issue scopes.
permissions:
  contents: read

jobs:
  revoke:
    name: revoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Mint a GitHub App token so the bot writes the ledger to protected `main`
      # under the codesign-bot App identity — the ruleset bypass actor (design §6).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: apptoken
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Run privileged revocation
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token }}
          ISSUER_BOT_LOGIN: ${{ vars.ISSUER_BOT_LOGIN }}
          APP_ID: ${{ inputs.app_id }}
          SERIAL: ${{ inputs.serial }}
          REASON: ${{ inputs.reason }}
          REVOKED_FROM: ${{ inputs.revoked_from }}
          ACTOR: ${{ github.actor }}
        run: go run ./cmd/privrevoke
