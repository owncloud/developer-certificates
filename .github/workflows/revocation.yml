name: revocation

# The revocation bot polls open revocation-request issues and processes the
# self-service, CMS-signed path (enrollment spec §5.1). It runs on a schedule and
# on issue events; it never acts on human comment events (spec §2: polling, not
# comment-triggered).
on:
  schedule:
    - cron: "*/10 * * * *" # spec §11: 10-minute poll cadence
  issues:
    types: [opened, edited, labeled]

# Shares the issuer's concurrency group so ledger reads/writes across both bots
# are serialized; in-progress runs are never cancelled (spec §2, design §6).
concurrency:
  group: ledger-write
  cancel-in-progress: false

# Minimal permissions (design §10): the workflow's default GITHUB_TOKEN is used
# ONLY by actions/checkout, so it needs read-only contents. All issue, comment,
# label and ledger writes go through the minted codesign-bot App token (passed as
# GITHUB_TOKEN env to the binary), which is the protected-main bypass actor (§6).
permissions:
  contents: read

jobs:
  revoke:
    name: revoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Mint a GitHub App token so the bot writes the ledger to protected `main`
      # under the codesign-bot App identity — the ruleset bypass actor (design §6).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: apptoken
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Run revoker
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token }}
          ISSUER_BOT_LOGIN: ${{ vars.ISSUER_BOT_LOGIN }}
        run: go run ./cmd/revoker
